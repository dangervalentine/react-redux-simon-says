<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Simon Says">
  <title>Simon Says</title>

  <!--
    The console in miniature: four quadrant pads around a dark centre dial.
    Uses the same Night Owl tokens as the app, so the icon and the board are
    the same artifact:
      #011627 — background.base (case and the gaps between pads)
      #132A3E — background.elevated (centre dial)
      #F07178 #FFCB6B #7fdbca #C792EA — the four pad accents

    Designed at a 32x32 viewBox. The quadrant gaps are deliberately wide so
    the four pads stay separable at 16px, where thinner seams close up.
  -->

  <circle cx="16" cy="16" r="15.5" fill="#011627" />

  <!-- Pads, clockwise from top-left. -->
  <path d="M16 16 L16 3 A13 13 0 0 0 3 16 Z" fill="#F07178" />
  <path d="M16 16 L16 3 A13 13 0 0 1 29 16 Z" fill="#FFCB6B" />
  <path d="M16 16 L16 29 A13 13 0 0 1 3 16 Z" fill="#7fdbca" />
  <path d="M16 16 L29 16 A13 13 0 0 1 16 29 Z" fill="#C792EA" />

  <!-- Seams between the quadrants. -->
  <rect x="15" y="2" width="2" height="28" fill="#011627" />
  <rect x="2" y="15" width="28" height="2" fill="#011627" />

  <!-- Centre dial. -->
  <circle cx="16" cy="16" r="7" fill="#011627" />
  <circle cx="16" cy="16" r="5.5" fill="#132A3E" stroke="#2c4f6b" stroke-width="0.5" />
</svg>
